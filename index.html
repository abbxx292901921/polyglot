<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content, viewport-fit=cover" />
  <title>Polyglot</title>
  <meta name="description" content="Private, offline-first, local roleplay chat. Your data stays on your device." />
  <meta name="theme-color" content="#0f1420" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Polyglot" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <link rel="apple-touch-icon" href="./icons/icon.svg" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button id="btn-left" class="iconbtn" aria-label="Open library">&#9776;</button>
      <h1>Polyglot</h1>
      <span id="ver" class="ver">v1.0.0</span>
      <div class="spacer"></div>
      <button id="btn-right" class="iconbtn" aria-label="Open settings">&#9881;</button>
    </header>

    <div id="update-banner" role="status">
      <span>&#9889; Update detected.</span>
      <button id="reload-btn" type="button">Tap to Reload</button>
    </div>

    <main id="chat" aria-live="polite">
      <div class="empty" id="empty">
        Polyglot is ready. Your chats stay on this device.
        <small>Phase 0 shell: offline UI test. Real AI wiring lands in Phase 2.</small>
      </div>
    </main>

    <section id="composer">
      <textarea id="input" rows="1" placeholder="Message…" enterkeyhint="send"></textarea>
      <button id="send" type="button" aria-label="Send">&#9650;</button>
      <button id="stop" type="button" aria-label="Stop">Stop</button>
    </section>
  </div>

  <nav id="drawer-left" class="drawer" aria-label="Library">
    <header><h2>Characters &amp; Personas</h2><button class="iconbtn" data-close="drawer-left" aria-label="Close">&times;</button></header>
    <div class="body">
      <section class="sec">
        <h3>Persona <button id="btn-new-persona" class="mini" type="button">+ New</button></h3>
        <div id="persona-list" class="list"></div>
      </section>
      <section class="sec">
        <h3>Characters <button id="btn-new-char" class="mini" type="button">+ New</button></h3>
        <div id="char-list" class="list"></div>
      </section>
      <section class="sec">
        <h3>Chats <button id="btn-new-chat" class="mini" type="button">+ New</button></h3>
        <div id="chat-list" class="list"></div>
      </section>
      <section class="sec">
        <h3>Vault backup</h3>
        <label class="checkline"><input type="checkbox" id="chk-keys" /> Include API keys in backup</label>
        <div class="vaultbtns">
          <button id="btn-export" class="btn" type="button">Export vault</button>
          <label class="btn secondary" for="file-import">Import vault</label>
          <input id="file-import" type="file" accept="application/json,.json" hidden />
        </div>
        <div id="vault-status" class="status" role="status"></div>
      </section>
    </div>
  </nav>

  <aside id="drawer-right" class="drawer right" aria-label="Settings">
    <header><h2>Presets &amp; API</h2><button class="iconbtn" data-close="drawer-right" aria-label="Close">&times;</button></header>
    <div class="body">Model presets, samplers, and API config arrive in Phase 2.</div>
  </aside>

  <div id="backdrop"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
